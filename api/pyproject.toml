[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "eg-crypto"
version = "0.2.0"
description = "Encryptoglyph envelope cryptography. Wire-compatible with the Rust core."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "cryptography==50.0.2",
  "PyNaCl==1.6.2",
]

[project.optional-dependencies]
api = [
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["eg_crypto*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]
