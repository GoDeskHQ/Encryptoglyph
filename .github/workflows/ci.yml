name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: [self-hosted, godesk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # actions/setup-python has no Debian 13 builds. Install CPython 3.12
      # with uv into a venv (uv-managed interpreters reject ensurepip/pip).
      - name: Set up Python 3.12
        env:
          PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "$PYTHON_VERSION"
          VENV="$RUNNER_TEMP/python"
          # --seed installs pip/setuptools/wheel; uv venvs omit pip by default.
          uv venv --seed --python "$PYTHON_VERSION" "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version
          "$VENV/bin/python" -m pip install --upgrade pip

      - name: Ruff
        run: |
          python -m pip install ruff==0.16.10
          ruff check api

  pytest:
    name: pytest
    runs-on: [self-hosted, godesk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # actions/setup-python has no Debian 13 builds. Install CPython 3.12
      # with uv into a venv (uv-managed interpreters reject ensurepip/pip).
      - name: Set up Python 3.12
        env:
          PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "$PYTHON_VERSION"
          VENV="$RUNNER_TEMP/python"
          # --seed installs pip/setuptools/wheel; uv venvs omit pip by default.
          uv venv --seed --python "$PYTHON_VERSION" "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version
          "$VENV/bin/python" -m pip install --upgrade pip

      - name: Pytest
        working-directory: api
        run: |
          python -m pip install -r requirements-dev.txt
          pytest

  compose-config:
    name: compose-config
    runs-on: [self-hosted, godesk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Compose config
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config -q

  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, godesk]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose --redact --no-banner

  built-shell-assert:
    name: built-shell-assert
    runs-on: [self-hosted, godesk]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Exposure probe against the api container
        run: bash scripts/assert-exposure.sh

  rust-core:
    name: rust-core
    runs-on: [self-hosted, godesk]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/encryptoglyph
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # actions/setup-python has no Debian 13 builds. Install CPython 3.12
      # with uv into a venv (uv-managed interpreters reject ensurepip/pip).
      - name: Set up Python 3.12
        env:
          PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "$PYTHON_VERSION"
          VENV="$RUNNER_TEMP/python"
          # --seed installs pip/setuptools/wheel; uv venvs omit pip by default.
          uv venv --seed --python "$PYTHON_VERSION" "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version
          "$VENV/bin/python" -m pip install --upgrade pip

      - name: License fields and Cargo package metadata are Apache-2.0
        working-directory: .
        run: python3 scripts/check-license-metadata.py --require-cargo-metadata

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Licenses, advisories, bans and sources
        run: cargo deny check

  license-metadata:
    name: license-metadata
    runs-on: [self-hosted, godesk]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # actions/setup-python has no Debian 13 builds. Install CPython 3.12
      # with uv into a venv (uv-managed interpreters reject ensurepip/pip).
      - name: Set up Python 3.12
        env:
          PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "$PYTHON_VERSION"
          VENV="$RUNNER_TEMP/python"
          # --seed installs pip/setuptools/wheel; uv venvs omit pip by default.
          uv venv --seed --python "$PYTHON_VERSION" "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version
          "$VENV/bin/python" -m pip install --upgrade pip

      - name: License fields are Apache-2.0
        run: python3 scripts/check-license-metadata.py

  e2e:
    name: e2e
    runs-on: [self-hosted, godesk]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # actions/setup-python has no Debian 13 builds. Install CPython 3.12
      # with uv into a venv (uv-managed interpreters reject ensurepip/pip).
      - name: Set up Python 3.12
        env:
          PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v uv >/dev/null 2>&1; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv python install "$PYTHON_VERSION"
          VENV="$RUNNER_TEMP/python"
          # --seed installs pip/setuptools/wheel; uv venvs omit pip by default.
          uv venv --seed --python "$PYTHON_VERSION" "$VENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"
          "$VENV/bin/python" --version
          "$VENV/bin/python" -m pip install --upgrade pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: API dependencies
        working-directory: api
        run: python -m pip install -r requirements.txt

      - name: Playwright
        working-directory: e2e
        run: |
          set -euo pipefail
          npm install
          # Debian 13 is not in Playwright's official dependency matrix.
          # --with-deps falls back to Ubuntu 20.04 packages and fails.
          # Passwordless sudo on these runners covers apt only.
          sudo apt-get update
          pkgs=(
            libnss3 libnspr4 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
            libx11-6 libx11-xcb1 libxcb1 libxext6 libxshmfence1 ca-certificates
          )
          for base in libatk1.0-0 libatk-bridge2.0-0 libcups2 libasound2 libatspi2.0-0 libgtk-3-0; do
            if apt-cache show "${base}t64" >/dev/null 2>&1; then
              pkgs+=("${base}t64")
            else
              pkgs+=("$base")
            fi
          done
          sudo apt-get install -y --no-install-recommends "${pkgs[@]}"
          npx playwright install chromium

      - name: Console flows
        working-directory: e2e
        run: npx playwright test

